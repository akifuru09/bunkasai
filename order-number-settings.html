<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>注文番号設定 - 文化祭システム</title><link rel="stylesheet" href="style.css?v=20260910-flow1"></head><body><header><h1>注文番号設定</h1></header><main><h2 id="className"></h2><section><label for="maxTicketNumber">最大注文番号</label><div class="inline-number-input"><input id="maxTicketNumber" type="number" min="1" max="999"><span>番まで</span></div></section><section><h3>自動割り当て</h3><label class="switch-row"><input id="autoCycle" type="checkbox"><span>注文時に空いている番号を順番に自動割り当てする</span></label><p class="option-help">OFFの場合は、注文時に空いている番号を一覧から選びます。</p></section><button id="saveButton">保存</button><p id="message"></p><button id="backButton">戻る</button></main><script src="order-number-settings.js?v=20260910-flow1"></script></body></html>
