<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>業務設定 - 文化祭システム</title>
    <link rel="stylesheet" href="style.css?v=20260910-ui3">
</head>

<body class="page-work-management">

    <header>
        <h1>業務設定</h1>
        <p id="className"></p>
    </header>

    <main>

        <p id="message"></p>

        <section>
            <h2>業務</h2>

            <div id="workAssignmentList"></div>
        </section>

        <section>
            <h2>業務を追加</h2>

            <input id="workAssignmentName" type="text" placeholder="業務名">

            <div id="screenSelect">
                <label>
                    <input type="checkbox" value="1">
                    注文
                </label>

                <label>
                    <input type="checkbox" value="2">
                    会計
                </label>

                <label>
                    <input type="checkbox" value="3">
                    注文管理
                </label>

                <label>
                    <input type="checkbox" value="4">
                    売上
                </label>

                <label>
                    <input type="checkbox" value="5">
                    商品管理
                </label>

                <label>
                    <input type="checkbox" value="6">
                    ユーザー管理
                </label>
            </div>
            <button id="addButton">
                追加
            </button>

        </section>

        <button id="backButton">
            戻る
        </button>

    </main>

    <script src="work-management.js"></script>

</body>

</html>
