<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>会計 - 文化祭システム</title>
  <link rel="stylesheet" href="style.css?v=20260910-ui4">
</head>
<body class="page-accounting">
  <header>
    <h1>会計</h1>
  </header>

  <main>
    <h2 id="className"></h2>

    <section class="number-entry-section">
      <h3>チケット番号</h3>
      <input id="ticketNumber" class="number-display" type="text" inputmode="none" readonly placeholder="1〜50" aria-label="チケット番号">
      <div id="ticketKeypad" class="numeric-keypad" aria-label="チケット番号テンキー"></div>
      <button id="searchButton">検索</button>
    </section>

    <section>
      <h3>注文内容</h3>
      <div id="order"></div>
      <p id="total"></p>
    </section>

    <section id="paymentSection" style="display: none;">
      <h3>支払い方法</h3>
      <button id="cashButton">現金</button>
      <button id="paypayButton">PayPay</button>
    </section>

    <p id="message"></p>
    <button id="backButton">戻る</button>
  </main>

  <script src="accounting.js?v=20260910-keypad1"></script>
</body>
</html>
