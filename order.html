<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注文 - 文化祭システム</title>
  <link rel="stylesheet" href="style.css?v=20260910-ui4">
</head>
<body class="page-order">
  <header>
    <h1>注文</h1>
  </header>

  <main>
    <h2 id="className"></h2>

    <section class="number-entry-section">
      <h3>チケット番号</h3>
      <input id="ticketNumber" class="number-display" type="text" inputmode="none" readonly placeholder="1〜50" aria-label="チケット番号">
      <div id="ticketKeypad" class="numeric-keypad" aria-label="チケット番号テンキー"></div>
    </section>

    <section>
      <h3>商品</h3>
      <div id="products"></div>
    </section>

    <section>
      <h3>注文内容</h3>
      <div id="cart"></div>
      <p id="total">合計 0円</p>
    </section>

    <button id="orderButton">注文を確定</button>
    <button id="backButton">戻る</button>
    <p id="message"></p>
  </main>

  <script src="order.js?v=20260910-quantity-keypad1"></script>
</body>
</html>
