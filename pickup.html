<!DOCTYPE html>

<html lang="ja"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>受け取り - 文化祭システム</title><link href="style.css?v=20260911-time2" rel="stylesheet"/></head><body class="page-pickup has-global-back"><nav aria-label="ページナビゲーション" class="global-back-bar">
<button class="global-back-button" id="backButton" type="button">← 戻る</button>
<button class="global-correction-button" id="correctionButton" type="button">訂正</button>
</nav>
<header><h1 id="pageTitle">受け取り</h1></header><main><h2 id="className"></h2><div aria-live="polite" class="completion-notice" hidden="" id="completionNotice" role="status"></div><p id="message"></p><section><h3>未受け取りの注文</h3><div class="workflow-order-list" id="orderList"></div></section><section class="workflow-action-panel" hidden="" id="detailSection"><h3>選択中の注文</h3><div id="order"></div><p id="total"></p><div class="pickup-detail-actions"><button class="secondary-action" id="editOrderButton" type="button">注文内容を訂正</button><button id="pickupButton">受け取り完了</button></div></section></main><section class="correction-overlay" hidden id="correctionPanel" aria-label="最近の操作の訂正">

<p class="correction-help">この業務で最近処理した8件まで表示します。訂正した操作も履歴に残ります。</p>
<p id="correctionMessage"></p>
<div id="correctionList" class="correction-list"></div>
</div>
</section><script src="pickup.js?v=20260911-time2"></script></body></html>
