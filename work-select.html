<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>業務選択 - 文化祭システム</title>

    <link rel="stylesheet" href="style.css?v=20260911-ticketmgmt1">
</head>

<body class="page-work-select">

<header>
    <h1>業務選択</h1>
    <p id="className"></p>
</header>

<main>

    <p id="message"></p>

    <section class="work-select-section">
        <h2>業務</h2>
        <div id="workList"></div>
    </section>

    <section class="work-select-section work-select-number-section">
        <h2>注文番号</h2>
        <div id="ticketManagementList">
            <button id="activeTicketsButton" class="work-mode-button" type="button">
                <strong>使用中の注文番号</strong>
                <span>現在使用中の注文を古い順に確認・処理する</span>
            </button>
            <button id="allTicketsButton" class="work-mode-button" type="button">
                <strong>全注文番号</strong>
                <span>すべての番号の状態確認・使用不可設定をする</span>
            </button>
        </div>
    </section>

    <button id="backButton">
        担当者確認に戻る
    </button>

</main>

<script src="work-select.js?v=20260911-ticketmgmt1"></script>

</body>
</html>
